<script>
(function () {
  try {
    var id = String(window.__LEAGUE_ID || '');
    if (/^espn-/.test(id)) return;
    id = id.replace(/[^0-9]/g, '');
    if (!id) return;
    var api = 'https://api.sleeper.app/v1', e = window.__early = {};
    [api + '/state/nfl', api + '/league/' + id].forEach(function (u) { e[u] = fetch(u, { cache: 'no-store' }); e[u].catch(function () {}); });
  } catch (x) {}
})();

<div id="tip" hidden style="position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:min(320px,calc(100vw - 32px));background:#1d140c;color:#fff4d6;border:2px solid #ffd84a;border-radius:12px;padding:10px 12px;font:14px system-ui,sans-serif;box-shadow:0 6px 18px #0008">
<b>Tip:</b> &#127941; <b>Awards</b> (top bar) and <b>Matchup &rarr; Share</b> make pictures for your group chat. <button id="tip-x" type="button" style="margin-left:4px;border:0;background:#ffd84a;border-radius:6px;font-weight:700;padding:2px 8px">Got it</button>
</div>
<script>
(function () {
  // one-time usage hint, a few seconds after the visitor picks their team ("Who are you?")
  var tipDone = false;
  document.addEventListener('click', function (e) {
    if (tipDone || !e.target.closest || !e.target.closest('.who-btn')) return;
    tipDone = true;
    try { if (localStorage.getItem('st-tip')) return; localStorage.setItem('st-tip', '1'); } catch (x) {}
    setTimeout(function showTip() { if (window.__bubbleUp()) { setTimeout(showTip, 4000); return; } var t = document.getElementById('tip'); t.hidden = false; var off = function () { t.hidden = true; document.removeEventListener('pointerdown', off, true); }; document.getElementById('tip-x').onclick = off; setTimeout(function () { document.addEventListener('pointerdown', off, true); }, 400); setTimeout(off, 6000); }, 2500);  // Oct 24 2026 (round 57): above Matchup/Share, not on your own row (top of the field on 375x667); any tap or 6 s hides it
  }, true);
})();
</script>
<div id="a2hs" hidden style="position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:min(320px,calc(100vw - 32px));background:#fff8e6;color:#1d140c;border:2px solid #9e7c0c;border-radius:12px;padding:10px 12px;font:14px system-ui,sans-serif;box-shadow:0 6px 18px #0008">
<b>&#128242; Keep the stadium one tap away:</b> <span id="a2hs-how"></span> <button id="a2hs-x" type="button" style="margin-left:4px;border:0;background:#ffd84a;border-radius:6px;font-weight:700;padding:2px 8px">OK</button></div>
<script>
(function () {
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  var box = document.getElementById('a2hs'), how = document.getElementById('a2hs-how'), deferred = null;
  var seen = function () { try { return localStorage.getItem('st-a2hs'); } catch (e) { return '1'; } };
  var mark = function () { try { localStorage.setItem('st-a2hs', '1'); } catch (e) {} };
  var day = new Date().toISOString().slice(0, 10), first = null;
  try { first = localStorage.getItem('st-first-day'); if (!first) localStorage.setItem('st-first-day', day); } catch (e) {}
  if (!first || first === day || seen()) return;  // only from the 2nd day someone comes back
  var show = function (html) {
    var pn = document.getElementById('panel'); if ((pn && !pn.hidden) || window.__bubbleUp()) { setTimeout(function () { show(html); }, 5000); return; }
    how.innerHTML = html; box.hidden = false; mark();
    document.getElementById('a2hs-x').onclick = function () { box.hidden = true; };
    setTimeout(function () { box.hidden = true; }, 15000);
  };
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    setTimeout(function () { show('<button id="a2hs-go" type="button" style="border:0;background:#24292f;color:#fff;border-radius:6px;font-weight:700;padding:3px 9px">Install</button>');
      var g = document.getElementById('a2hs-go'); if (g) g.onclick = function () { box.hidden = true; deferred.prompt(); }; }, 20000);
  });
  if (/iPhone|iPad/.test(navigator.userAgent)) setTimeout(function () { show('tap Share &#11014;&#65039; then <b>Add to Home Screen</b>.'); }, 20000);
})();
</script>
